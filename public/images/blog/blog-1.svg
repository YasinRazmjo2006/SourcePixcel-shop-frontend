<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4056"/>
      <stop offset="100%" style="stop-color:#FF7B8A"/>
    </linearGradient>
    <filter id="shadow-1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="1200" height="600" fill="url(#bg-1)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="180" fill="white" opacity="0.08"/>
  <circle cx="150" cy="520" r="140" fill="white" opacity="0.06"/>
  <circle cx="950" cy="520" r="100" fill="white" opacity="0.05"/>
  <circle cx="200" cy="100" r="80" fill="white" opacity="0.04"/>

  <!-- Category badge -->
  <rect x="60" y="60" width="200" height="48" rx="24" fill="white" opacity="0.25"/>
  <text x="160" y="92" font-family="Tahoma, Arial, sans-serif" font-size="22" font-weight="bold"
        fill="white" text-anchor="middle">فناوری</text>

  <!-- Emoji icon (huge) -->
  <text x="950" y="380" font-size="320" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow-1)">📱</text>

  <!-- Persian title -->
  <text x="60" y="380" font-family="Tahoma, Arial, sans-serif" font-size="54" font-weight="bold"
        fill="white" text-anchor="start" direction="rtl">بهترین گوشی‌های هوشمند ۲۰۲۴</text>

  <!-- English title -->
  <text x="60" y="450" font-family="Arial, sans-serif" font-size="32" font-weight="500"
        fill="white" opacity="0.85" text-anchor="start">Best Smartphones 2024</text>

  <!-- Bottom accent line -->
  <rect x="60" y="500" width="120" height="6" rx="3" fill="white" opacity="0.7"/>
</svg>