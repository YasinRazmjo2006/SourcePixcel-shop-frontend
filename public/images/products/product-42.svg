<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="icon-bg-42" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <filter id="shadow-42" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-42)"/>

  <!-- Decorative circles -->
  <circle cx="500" cy="100" r="120" fill="#06B6D4" opacity="0.05"/>
  <circle cx="80" cy="520" r="90" fill="#22D3EE" opacity="0.08"/>
  <circle cx="560" cy="480" r="60" fill="#06B6D4" opacity="0.06"/>

  <!-- Icon card -->
  <rect x="180" y="130" width="240" height="240" rx="60" fill="white" opacity="0.9" filter="url(#shadow-42)"/>
  <rect x="180" y="130" width="240" height="240" rx="60" fill="url(#icon-bg-42)" opacity="0.15"/>

  <!-- Icon -->
  <text x="300" y="265" font-size="130" text-anchor="middle" dominant-baseline="middle">🎮</text>

  <!-- Product name Persian -->
  <text x="300" y="420" font-family="Tahoma, Arial, sans-serif" font-size="26" font-weight="bold"
        fill="#3F4064" text-anchor="middle" direction="rtl">کنسول PlayStation 5</text>

  <!-- Product name English -->
  <text x="300" y="460" font-family="Arial, sans-serif" font-size="18"
        fill="#62666D" text-anchor="middle">Sony PlayStation 5</text>

  <!-- Category badge -->
  <rect x="220" y="500" width="160" height="36" rx="18" fill="#06B6D4" opacity="0.15"/>
  <text x="300" y="523" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        fill="#06B6D4" text-anchor="middle" letter-spacing="1">GAMING</text>
</svg>