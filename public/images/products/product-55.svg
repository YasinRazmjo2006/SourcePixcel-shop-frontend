<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bg-55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:0.15"/>
    </linearGradient>
    <linearGradient id="icon-bg-55" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FB923C"/>
    </linearGradient>
    <filter id="shadow-55" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F97316" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bg-55)"/>

  <!-- Decorative circles -->
  <circle cx="500" cy="100" r="120" fill="#F97316" opacity="0.05"/>
  <circle cx="80" cy="520" r="90" fill="#FB923C" opacity="0.08"/>
  <circle cx="560" cy="480" r="60" fill="#F97316" opacity="0.06"/>

  <!-- Icon card -->
  <rect x="180" y="130" width="240" height="240" rx="60" fill="white" opacity="0.9" filter="url(#shadow-55)"/>
  <rect x="180" y="130" width="240" height="240" rx="60" fill="url(#icon-bg-55)" opacity="0.15"/>

  <!-- Icon -->
  <text x="300" y="265" font-size="130" text-anchor="middle" dominant-baseline="middle">👕</text>

  <!-- Product name Persian -->
  <text x="300" y="420" font-family="Tahoma, Arial, sans-serif" font-size="26" font-weight="bold"
        fill="#3F4064" text-anchor="middle" direction="rtl">جاکت نایک Windrunner</text>

  <!-- Product name English -->
  <text x="300" y="460" font-family="Arial, sans-serif" font-size="18"
        fill="#62666D" text-anchor="middle">Nike Windrunner Jacket</text>

  <!-- Category badge -->
  <rect x="220" y="500" width="160" height="36" rx="18" fill="#F97316" opacity="0.15"/>
  <text x="300" y="523" font-family="Arial, sans-serif" font-size="14" font-weight="bold"
        fill="#F97316" text-anchor="middle" letter-spacing="1">CLOTHING</text>
</svg>