<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4056"/>
      <stop offset="100%" style="stop-color:#d63850"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="100" r="200" fill="white" opacity="0.1"/>
  <circle cx="100" cy="550" r="250" fill="white" opacity="0.05"/>
  <circle cx="600" cy="315" r="400" fill="white" opacity="0.03"/>

  <!-- Logo -->
  <g transform="translate(600, 220)">
    <rect x="-60" y="-60" width="120" height="120" rx="24" fill="white"/>
    <text x="0" y="30" font-family="Arial, sans-serif" font-size="72" font-weight="900"
          fill="#EF4056" text-anchor="middle">S</text>
  </g>

  <!-- Store name -->
  <text x="600" y="360" font-family="Arial, sans-serif" font-size="80" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="-2">SourcePixcel</text>

  <!-- Subtitle -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="32" font-weight="500"
        fill="rgba(255,255,255,0.9)" text-anchor="middle">Modern Online Store | فروشگاه آنلاین مدرن</text>

  <!-- Features -->
  <text x="600" y="510" font-family="Arial, sans-serif" font-size="24"
        fill="rgba(255,255,255,0.85)" text-anchor="middle">✓ Fast Shipping   ✓ Authenticity   ✓ 7-Day Return</text>
</svg>